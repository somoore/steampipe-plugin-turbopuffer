name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build + standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ci/checks.sh fails when no secret scanner is available and CI is set,
      # so install gitleaks from a tagged release. This is a plain `go install`
      # rather than another third-party action to pin.
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make test = gofmt check + go vet + security checks (incl. the gitleaks
      # secret scan) + go test ./...
      - name: make test
        run: make test

      # Security-relevant logic (region validation, vector redaction, recall
      # bounds) is pure Go; run it under the race detector too.
      - name: go test -race
        run: go test -race ./...
