# Submits the fully resolved Go module graph (direct + indirect) to GitHub's
# dependency graph on every push to main. Dependabot's built-in Go graph job
# only refreshes direct requirements, which left indirect modules (grpc, otel,
# klauspost/compress) frozen at old versions and kept fixed alerts open.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go module graph
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
        with:
          go-mod-path: go.mod
          go-build-target: all
