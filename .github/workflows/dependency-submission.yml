# Submits the fully resolved Go module graph (direct + indirect) to GitHub's
# dependency graph on every push to main. Dependabot's built-in Go graph job
# only refreshes direct requirements, which left indirect modules (grpc, otel,
# klauspost/compress) frozen at old versions and kept fixed alerts open.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go module graph
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Submit go list -m all to the dependency graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # actions/go-dependency-submission v2.0.3 crashes on cloud.google.com/go
        # ("expected no more than one package in cache with namespace+name").
        run: ci/submit-go-deps.sh .
